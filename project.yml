name: GymTrack
options:
  bundleIdPrefix: com.johannes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  GymTrack:
    type: application
    platform: iOS
    sources:
      - path: GymTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannes.gymtrack
        PRODUCT_NAME: GymTrack
        CODE_SIGN_ENTITLEMENTS: GymTrack/GymTrack.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GymTrack
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  GymTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymTrackTests
    dependencies:
      - target: GymTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GymTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GymTrackUITests
    dependencies:
      - target: GymTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GymTrack
schemes:
  GymTrack:
    build:
      targets:
        GymTrack: all
        GymTrackTests: [test]
        GymTrackUITests: [test]
    test:
      config: Debug
      targets:
        - GymTrackTests
        - GymTrackUITests
    run:
      config: Debug
    archive:
      config: Release
